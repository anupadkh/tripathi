components:
  schemas:
    AccountMovement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        reference:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        account:
          type: integer
          readOnly: true
      required:
      - account
      - amount
      - date
      - description
      - id
      - reference
    AccountTransfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentStatusEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        notes:
          type: string
        cancellation_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        created_by:
          type: integer
          readOnly: true
          nullable: true
        source_account:
          type: integer
        destination_account:
          type: integer
      required:
      - cancellation_reason
      - created_at
      - created_by
      - destination_account
      - id
      - revision
      - source_account
      - status
    AllocationBatch:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationInput'
      required:
      - allocations
      - revision
    AllocationInput:
      type: object
      properties:
        invoice:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - amount
      - invoice
    AllocationReversal:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        allocation_ids:
          type: array
          items:
            type: integer
            minimum: 1
        reason:
          type: string
      required:
      - allocation_ids
      - reason
      - revision
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        resource:
          type: string
          readOnly: true
        resource_id:
          type: integer
          readOnly: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
      required:
      - action
      - actor
      - created_at
      - details
      - id
      - resource
      - resource_id
    Cancellation:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
        date:
          type: string
          format: date
      required:
      - reason
      - revision
    ChequeAction:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
      required:
      - date
      - revision
    ChequeStatusEnum:
      enum:
      - pending
      - cleared
      - bounced
      type: string
      description: |-
        * `pending` - pending
        * `cleared` - cleared
        * `bounced` - bounced
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          maxLength: 300
        address:
          type: string
          nullable: true
          maxLength: 300
        phone:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        pan:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        contact_person:
          type: integer
          nullable: true
      required:
      - balance
      - id
      - name
    DensityGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        density:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        taxable:
          type: boolean
          readOnly: true
          default: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        invoice:
          type: integer
          readOnly: true
      required:
      - amount
      - density
      - id
      - invoice
      - quantity
      - taxable
      - unit
